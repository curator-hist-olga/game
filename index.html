<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад числа — гра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#DDEFFF; --sky2:#C3E2FF; --card:#FFFFFF; --ink:#23305A; --muted:#5B6890;
  --roof:#E5533D; --wall:#FFD45C; --wallEdge:#E9B530; --grass:#5DB35D;
  --a:#7B5CD6; --b:#FF8A3D; --ok:#2FA35A; --bad:#E0473A; --line:#B9CCE8;
  --btn:#FFFFFF; --btnText:#23305A; --shadow:0 4px 0 #9FB6D8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#16203D; --sky2:#1E2B50; --card:#24335E; --ink:#F2F5FF; --muted:#AAB6DA;
    --roof:#F0644E; --wall:#E9B937; --wallEdge:#C99A1F; --grass:#3F8F45;
    --a:#A58BFF; --b:#FF9E5C; --ok:#4CCB78; --bad:#FF6B5E; --line:#3A4C80;
    --btn:#2C3D6E; --btnText:#F2F5FF; --shadow:0 4px 0 #0E1630;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#16203D; --sky2:#1E2B50; --card:#24335E; --ink:#F2F5FF; --muted:#AAB6DA;
  --roof:#F0644E; --wall:#E9B937; --wallEdge:#C99A1F; --grass:#3F8F45;
  --a:#A58BFF; --b:#FF9E5C; --ok:#4CCB78; --bad:#FF6B5E; --line:#3A4C80;
  --btn:#2C3D6E; --btnText:#F2F5FF; --shadow:0 4px 0 #0E1630;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{touch-action:manipulation}
body{
  background:linear-gradient(var(--sky) 0%, var(--sky2) 100%) fixed;
  background-color:var(--sky);
  color:var(--ink);
  font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-weight:800;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--a);outline-offset:3px}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.iconbtn{background:var(--btn);color:var(--btnText);border:0;border-radius:14px;padding:10px 14px;font-size:18px;box-shadow:var(--shadow)}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.stars{font-size:22px;background:var(--btn);border-radius:14px;padding:8px 14px;box-shadow:var(--shadow)}

/* title */
h1{font-size:clamp(38px,9vw,64px);font-weight:900;line-height:1;margin:18px 0 6px;letter-spacing:-1px;text-align:center}
h1 span{display:inline-block}
h1 span:nth-child(odd){color:var(--roof)} h1 span:nth-child(even){color:var(--a)}
.sub{text-align:center;color:var(--muted);font-weight:600;font-size:18px;margin:0 0 22px}
h2{font-size:22px;margin:22px 0 10px;text-align:center}

/* number picker */
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.num{background:var(--btn);color:var(--btnText);border:3px solid transparent;border-radius:16px;font-size:28px;padding:10px 0;box-shadow:var(--shadow)}
.num.all{grid-column:span 5;font-size:20px}
.num.sel{border-color:var(--a);background:var(--a);color:#fff}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mode{background:var(--card);border:0;border-radius:22px;padding:16px 12px;text-align:center;box-shadow:var(--shadow)}
.mode .em{font-size:44px;display:block}
.mode b{display:block;font-size:19px;margin-top:4px}
.mode small{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.mode:active,.num:active{transform:translateY(3px);box-shadow:none}

/* progress */
.prog{display:flex;gap:5px;justify-content:center;margin:4px 0 14px}
.prog i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.prog i.done{background:var(--ok)} .prog i.miss{background:var(--wallEdge)} .prog i.now{background:var(--a)}

.q{font-size:clamp(20px,5vw,26px);text-align:center;margin:6px 0 14px;min-height:1.3em}

/* HOUSE */
.house{width:var(--hw);margin:0 auto;position:relative}
.house{--hw:min(300px,86vw);--rh:96px;--wh:72px}
.roof{width:0;height:0;margin:0 auto;border-left:calc(var(--hw) / 2) solid transparent;border-right:calc(var(--hw) / 2) solid transparent;border-bottom:var(--rh) solid var(--roof);position:relative}
.roof span{position:absolute;left:50%;top:calc(var(--rh) * .31);transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--card);color:var(--ink);font-size:40px;font-weight:900;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.chimney{position:absolute;right:22%;top:10px;width:24px;height:42px;background:var(--roof);filter:brightness(.85);border-radius:3px 3px 0 0}
.walls{background:var(--wall);border:4px solid var(--wallEdge);border-top:0;border-radius:0 0 10px 10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.floor{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win{background:var(--card);border-radius:12px;height:var(--wh);display:grid;place-items:center;font-size:42px;font-weight:900;border:4px solid var(--wallEdge)}
.win.qm{color:var(--muted);animation:pulse 1.4s ease-in-out infinite}
.win.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.win.ca{color:var(--a)} .win.cb{color:var(--b)}
.grass{height:18px;background:var(--grass);border-radius:0 0 14px 14px;margin:0 -10px}
@keyframes pulse{50%{transform:scale(1.06)}}

/* dots */
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:14px auto 0;max-width:340px}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);transition:background .3s,border-color .3s}
.dot.a{background:var(--a);border-color:var(--a)} .dot.b{background:var(--b);border-color:var(--b)}
.dots.small .dot{width:16px;height:16px;border-width:2px}

/* answers */
.answers{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
.ans{min-width:74px;height:74px;font-size:36px;font-weight:900;border:0;border-radius:20px;background:var(--btn);color:var(--btnText);box-shadow:var(--shadow)}
.ans:active{transform:translateY(3px);box-shadow:none}
.ans.ok{background:var(--ok);color:#fff}
.ans.bad{background:var(--bad);color:#fff;opacity:.55}
.ans:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.say{text-align:center;font-size:22px;min-height:32px;margin-top:14px}
.say .x{color:var(--a)} .say .y{color:var(--b)}

/* basket */
.scene{background:var(--card);border-radius:26px;padding:18px 12px;text-align:center;box-shadow:var(--shadow)}
.total{display:inline-block;background:var(--sky2);border-radius:14px;padding:6px 16px;font-size:22px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:250px;font-size:36px;line-height:1.1}
.items span{display:inline-block;animation:pop .35s backwards}
@keyframes pop{from{transform:scale(0)}}
.plus{font-size:34px;color:var(--muted)}
.box{position:relative;font-size:84px;line-height:1}
.box b{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:30px;background:var(--card);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.box b.ok{background:var(--ok);color:#fff}

/* pairs */
.target{display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px;margin-bottom:10px}
.target b{background:var(--roof);color:#fff;border-radius:16px;padding:4px 18px;font-size:40px}
.slots{display:flex;justify-content:center;align-items:center;gap:10px;font-size:34px;margin:8px 0 6px}
.slot{width:64px;height:64px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-weight:900}
.slot.f1{border:3px solid var(--a);color:var(--a)} .slot.f2{border:3px solid var(--b);color:var(--b)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:16px auto 0}
.cardn{height:84px;border:0;border-radius:20px;background:var(--btn);color:var(--btnText);font-size:40px;font-weight:900;box-shadow:var(--shadow);transition:transform .15s}
.cardn.sel{background:var(--a);color:#fff;transform:translateY(-4px)}
.cardn.ok{background:var(--ok);color:#fff}
.cardn.gone{opacity:.25}

/* learn */
.learnnums{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:14px}
.learnnums button{width:44px;height:44px;border-radius:12px;border:0;background:var(--btn);color:var(--btnText);font-size:22px;box-shadow:var(--shadow)}
.learnnums button.sel{background:var(--roof);color:#fff}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.lrow .win{height:56px;font-size:32px}
.lrow:hover .win,.lrow.lit .win{border-color:var(--a)}
.tip{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:16px;font-weight:600;font-size:17px;line-height:1.45;box-shadow:var(--shadow)}
.tip b{font-weight:900}

/* end */
.end{text-align:center;padding-top:20px}
.big{font-size:90px;line-height:1}
.endstars{font-size:40px;letter-spacing:2px;margin:12px 0}
.cta{background:var(--a);color:#fff;border:0;border-radius:20px;font-size:22px;padding:14px 26px;box-shadow:0 5px 0 #4E36A0;margin:8px}
.cta.alt{background:var(--btn);color:var(--btnText);box-shadow:var(--shadow)}
.cta:active{transform:translateY(4px);box-shadow:none}

.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
/* маленькі телефони */
@media (max-width:420px){
  .wrap{padding:12px 12px 32px}
  .ans{min-width:62px;height:62px;font-size:30px}
  .num{font-size:24px;padding:8px 0}
  .nums{gap:8px}
  .cardn{height:72px;font-size:34px}
  .slot{width:54px;height:54px}
  .slots{font-size:28px}
  .items{font-size:30px}
  .box{font-size:70px}
  .iconbtn{padding:8px 11px;font-size:16px}
}
@media (max-width:340px){
  .house{--hw:90vw;--rh:80px;--wh:60px}
  .ans{min-width:54px;height:54px;font-size:26px}
}
/* планшети */
@media (min-width:700px){
  .wrap{max-width:820px;padding:24px 24px 48px}
  .house{--hw:380px;--rh:120px;--wh:88px}
  .roof span{width:76px;height:76px;font-size:48px}
  .win{font-size:52px}
  .lrow .win{height:64px;font-size:38px}
  .ans{min-width:92px;height:92px;font-size:44px;border-radius:24px}
  .answers{gap:16px}
  .cards{max-width:440px;gap:16px}
  .cardn{height:104px;font-size:48px}
  .num{font-size:34px;padding:14px 0}
  .modes{grid-template-columns:repeat(4,1fr)}
  .q{font-size:30px}
  .say{font-size:26px}
  .dot{width:32px;height:32px}
  .dots{max-width:440px}
  .items{font-size:44px;max-width:330px}
  .box{font-size:100px}
  .tip{font-size:19px}
}
/* ноутбуки: гра з будиночком поруч із відповідями */
@media (min-width:1024px) and (min-height:640px){
  .wrap{max-width:900px}
}
/* телефон, повернутий горизонтально */
@media (max-height:500px) and (orientation:landscape){
  .wrap{max-width:900px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  h1{margin-top:4px;font-size:40px}
  .house{--hw:240px;--rh:64px;--wh:52px}
  .roof span{top:16px;width:44px;height:44px;font-size:28px}
  .win{font-size:30px}
  .ans{min-width:56px;height:56px;font-size:28px}
  .answers{margin-top:10px}
  .modes{grid-template-columns:repeat(4,1fr)}
  .mode .em{font-size:32px}
  .nums{grid-template-columns:repeat(9,1fr)}
  .num.all{grid-column:span 9}
  .cardn{height:60px;font-size:30px}
  .cards{grid-template-columns:repeat(6,1fr);max-width:600px}
  .q{margin:2px 0 8px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- START -->
  <section id="start">
    <div class="bar"><span></span><button class="iconbtn" id="snd" aria-label="Звук">🔊</button></div>
    <h1><span>С</span><span>к</span><span>л</span><span>а</span><span>д</span> <span>ч</span><span>и</span><span>с</span><span>л</span><span>а</span></h1>
    <p class="sub">Кожне число живе у своєму будиночку</p>

    <h2>Яке число вчимо?</h2>
    <div class="nums" id="nums"></div>

    <h2>У що граємо?</h2>
    <div class="modes">
      <button class="mode" data-mode="learn"><span class="em">🏠</span><b>Вивчаємо</b><small>Подивись, з чого складається число</small></button>
      <button class="mode" data-mode="house"><span class="em">🪟</span><b>Будиночок</b><small>Хто живе у віконці?</small></button>
      <button class="mode" data-mode="basket"><span class="em">🧺</span><b>Хто сховався?</b><small>Порахуй, скільки в кошику</small></button>
      <button class="mode" data-mode="pairs"><span class="em">🧩</span><b>Знайди пару</b><small>Дві картки разом дають число</small></button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="bar">
      <button class="iconbtn" id="back" aria-label="Назад">⬅ Меню</button>
      <div class="stars" id="stars">⭐ 0</div>
      <button class="iconbtn" id="snd2" aria-label="Звук">🔊</button>
    </div>
    <div class="prog" id="prog"></div>
    <div id="stage"></div>
  </section>

  <!-- END -->
  <section id="end" class="hidden end">
    <div class="big" id="endEmoji">🏆</div>
    <h1 style="font-size:40px" id="endTitle">Молодець!</h1>
    <div class="endstars" id="endStars"></div>
    <p class="sub" id="endText"></p>
    <button class="cta" id="again">Грати ще раз</button>
    <button class="cta alt" id="menu">До меню</button>
  </section>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = arr => { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; };

const ROUNDS = 10;
const st = { num:'all', mode:null, round:0, score:0, results:[], firstTry:true, sound:true, busy:false, lastN:0, learnN:5 };

/* ---------- sound ---------- */
let ctx;
function tone(freq, dur, type, delay){
  if(!st.sound) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    const t = ctx.currentTime + (delay||0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sGood = () => { tone(523,.15); tone(659,.15,'sine',.12); tone(784,.25,'sine',.24); };
const sBad  = () => { tone(220,.25,'triangle'); };
const sTap  = (n) => tone(300 + (n||0)*40, .12, 'triangle');
const sWin  = () => [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'sine',i*.13));

function toggleSound(){
  st.sound = !st.sound;
  $('#snd').textContent = $('#snd2').textContent = st.sound ? '🔊' : '🔇';
  try{ localStorage.setItem('sklad-sound', st.sound ? '1':'0'); }catch(e){}
}
try{ if(localStorage.getItem('sklad-sound')==='0'){ st.sound=false; $('#snd').textContent=$('#snd2').textContent='🔇'; } }catch(e){}
$('#snd').onclick = toggleSound; $('#snd2').onclick = toggleSound;

/* ---------- number picker ---------- */
const nums = $('#nums');
for(let n=2;n<=10;n++){
  const b=document.createElement('button'); b.className='num'; b.textContent=n; b.dataset.n=n; nums.appendChild(b);
}
const allB=document.createElement('button'); allB.className='num all sel'; allB.textContent='🎲 Усі числа від 2 до 10'; allB.dataset.n='all'; nums.appendChild(allB);
nums.addEventListener('click', e=>{
  const b=e.target.closest('.num'); if(!b) return;
  nums.querySelectorAll('.num').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); st.num = b.dataset.n==='all' ? 'all' : +b.dataset.n; sTap(+b.dataset.n||5);
});

document.querySelectorAll('.mode').forEach(b=> b.onclick = ()=> startMode(b.dataset.mode));
$('#back').onclick = showMenu; $('#menu').onclick = showMenu;
$('#again').onclick = ()=> startMode(st.mode);

function show(id){ ['start','game','end'].forEach(s=> $('#'+s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }
function showMenu(){ show('start'); }

function pickN(){
  if(st.num!=='all') return st.num;
  let n; do{ n=rand(2,10); }while(n===st.lastN);
  st.lastN=n; return n;
}

/* ---------- game flow ---------- */
function startMode(mode){
  st.mode=mode; st.round=0; st.score=0; st.results=[];
  show('game');
  $('#stars').textContent='⭐ 0';
  if(mode==='learn'){ $('#prog').innerHTML=''; $('#stars').classList.add('hidden'); st.learnN = st.num==='all'?5:st.num; renderLearn(); return; }
  $('#stars').classList.remove('hidden');
  nextRound();
}
function renderProg(){
  let h='';
  for(let i=0;i<ROUNDS;i++){
    const c = i<st.results.length ? (st.results[i]?'done':'miss') : (i===st.round?'now':'');
    h+=`<i class="${c}"></i>`;
  }
  $('#prog').innerHTML=h;
}
function nextRound(){
  if(st.round>=ROUNDS) return finish();
  st.firstTry=true; st.busy=false;
  renderProg();
  ({house:renderHouse, basket:renderBasket, pairs:renderPairs})[st.mode]();
}
function roundWon(delay){
  st.busy=true;
  st.results.push(st.firstTry);
  if(st.firstTry){ st.score++; $('#stars').textContent='⭐ '+st.score; }
  sGood();
  st.round++;
  setTimeout(nextRound, delay||1600);
}
function finish(){
  show('end'); sWin();
  const s=st.score;
  $('#endStars').textContent = '⭐'.repeat(s) + '☆'.repeat(ROUNDS-s);
  let t,e,txt;
  if(s>=9){ e='🏆'; t='Чудово!'; txt='Ти справжній знавець складу числа!'; }
  else if(s>=6){ e='🌟'; t='Молодець!'; txt='Ще трохи потренуйся — і буде ідеально.'; }
  else { e='💪'; t='Добрий початок!'; txt='Зазирни в «Вивчаємо», а потім спробуй ще раз.'; }
  $('#endEmoji').textContent=e; $('#endTitle').textContent=t;
  $('#endText').textContent = `Зірочок: ${s} з ${ROUNDS}. ${txt}`;
  confetti();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const em=['⭐','🎈','🎉','✨','🍎','🌈'];
  for(let i=0;i<30;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.textContent=em[i%em.length]; d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(2+Math.random()*2.5)+'s'; d.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),5500);
  }
}

/* helpers */
function dotsHTML(n, a, showB, cls){
  let h=`<div class="dots ${cls||''}">`;
  for(let i=0;i<n;i++) h+=`<span class="dot ${i<a?'a':(showB?'b':'')}"></span>`;
  return h+'</div>';
}
function options(correct, n){
  const pool=[]; for(let i=0;i<=n;i++) if(i!==correct) pool.push(i);
  shuffle(pool);
  const near = pool.filter(x=>Math.abs(x-correct)<=2);
  const pick = shuffle(near).slice(0,3);
  for(const x of pool){ if(pick.length>=3) break; if(!pick.includes(x)) pick.push(x); }
  return shuffle([correct, ...pick]).sort((x,y)=>x-y);
}
function sayHTML(n,a,b){ return `<span class="x">${a}</span> і <span class="y">${b}</span> — це ${n}`; }
function bindAnswers(correct, onOk){
  $('#answers').addEventListener('click', e=>{
    const b=e.target.closest('.ans'); if(!b||st.busy||b.disabled) return;
    const v=+b.dataset.v;
    if(v===correct){ b.classList.add('ok'); $('#answers').querySelectorAll('.ans').forEach(x=>x.disabled=true); onOk(); }
    else { st.firstTry=false; sBad(); b.classList.add('bad','shake'); b.disabled=true; hint(); }
  });
}
let hint=()=>{};

/* ---------- MODE: house ---------- */
function renderHouse(){
  const n=pickN(), a=rand(1,n-1), b=n-a;
  const hideLeft = Math.random()<0.5;
  const correct = hideLeft ? a : b;
  const qs=['Хто живе у віконці?','Яке число сховалося?','Скільки не вистачає?'];
  $('#stage').innerHTML = `
    <p class="q">${qs[rand(0,2)]}</p>
    <div class="house">
      <div class="chimney"></div>
      <div class="roof"><span>${n}</span></div>
      <div class="walls">
        <div class="floor">
          <div class="win ${hideLeft?'qm':'ca'}" id="wl">${hideLeft?'?':a}</div>
          <div class="win ${hideLeft?'cb':'qm'}" id="wr">${hideLeft?b:'?'}</div>
        </div>
      </div>
      <div class="grass"></div>
    </div>
    <div id="dots"></div>
    <div class="answers" id="answers">${options(correct,n).map(v=>`<button class="ans" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="say" id="say"></div>`;
  hint = ()=>{
    // show known part as colored dots and the rest empty
    const known = hideLeft ? b : a;
    $('#dots').innerHTML = dotsHTML(n, 0, false);
    const ds=$('#dots').querySelectorAll('.dot');
    ds.forEach((d,i)=>{ if(hideLeft ? i>=n-known : i<known) d.classList.add(hideLeft?'b':'a'); });
    $('#say').innerHTML = `Порахуй порожні кружечки 👆`;
  };
  bindAnswers(correct, ()=>{
    const w = hideLeft ? $('#wl') : $('#wr');
    w.textContent=correct; w.className='win ok';
    $('#dots').innerHTML = dotsHTML(n,a,true);
    $('#say').innerHTML = sayHTML(n,a,b);
    roundWon();
  });
}

/* ---------- MODE: basket ---------- */
const THEMES=[
  {it:'🍎',box:'🧺',q:'Скільки яблучок у кошику?'},
  {it:'🐟',box:'🪣',q:'Скільки рибок у відерці?'},
  {it:'🐣',box:'🏠',q:'Скільки курчат у хатинці?'},
  {it:'🍬',box:'🎁',q:'Скільки цукерок у коробці?'},
  {it:'🦋',box:'🌳',q:'Скільки метеликів за деревом?'},
  {it:'⚽',box:'📦',q:'Скільки м’ячиків у ящику?'},
];
function renderBasket(){
  const n=pickN(), hidden=rand(1,n-1), seen=n-hidden, th=THEMES[rand(0,THEMES.length-1)];
  let items=''; for(let i=0;i<seen;i++) items+=`<span style="animation-delay:${i*60}ms">${th.it}</span>`;
  $('#stage').innerHTML = `
    <p class="q">${th.q}</p>
    <div class="scene">
      <div class="total">Усього: ${n} ${th.it}</div>
      <div class="row">
        <div class="items">${items}</div>
        <div class="plus">+</div>
        <div class="box">${th.box}<b id="hid">?</b></div>
      </div>
      <div id="dots"></div>
    </div>
    <div class="answers" id="answers">${options(hidden,n).map(v=>`<button class="ans" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="say" id="say"></div>`;
  hint = ()=>{
    $('#dots').innerHTML = dotsHTML(n, seen, false);
    $('#say').innerHTML = `Бачимо ${seen}. Скільки ще до ${n}? Порахуй порожні кружечки`;
  };
  bindAnswers(hidden, ()=>{
    $('#hid').textContent=hidden; $('#hid').classList.add('ok');
    $('#dots').innerHTML = dotsHTML(n, seen, true);
    $('#say').innerHTML = sayHTML(n,seen,hidden);
    roundWon();
  });
}

/* ---------- MODE: pairs ---------- */
function renderPairs(){
  const n=pickN();
  const a=rand(1,n-1), b=n-a;
  const vals=[a,b];
  let guard=0;
  while(vals.length<6 && guard++<200){
    const v=rand(1,Math.max(n-1,3));
    if(vals.filter(x=>x===v).length<2) vals.push(v);
  }
  shuffle(vals);
  let sel=[];
  $('#stage').innerHTML = `
    <p class="q">Вибери дві картки, щоб разом вийшло</p>
    <div class="target"><b>${n}</b></div>
    <div class="slots"><div class="slot" id="s1"></div>+<div class="slot" id="s2"></div>= ${n}</div>
    <div class="cards" id="cards">${vals.map((v,i)=>`<button class="cardn" data-i="${i}" data-v="${v}">${v}</button>`).join('')}</div>
    <div class="say" id="say"></div>`;
  const s1=$('#s1'), s2=$('#s2');
  function paint(){
    s1.textContent = sel[0]? sel[0].dataset.v : ''; s1.className='slot'+(sel[0]?' f1':'');
    s2.textContent = sel[1]? sel[1].dataset.v : ''; s2.className='slot'+(sel[1]?' f2':'');
  }
  $('#cards').addEventListener('click', e=>{
    const c=e.target.closest('.cardn'); if(!c||st.busy) return;
    if(sel.includes(c)){ c.classList.remove('sel'); sel=sel.filter(x=>x!==c); paint(); return; }
    if(sel.length>=2) return;
    sTap(+c.dataset.v); c.classList.add('sel'); sel.push(c); paint();
    if(sel.length===2){
      const x=+sel[0].dataset.v, y=+sel[1].dataset.v;
      if(x+y===n){
        sel.forEach(k=>{k.classList.remove('sel');k.classList.add('ok');});
        $('#cards').querySelectorAll('.cardn:not(.ok)').forEach(k=>k.classList.add('gone'));
        $('#say').innerHTML = sayHTML(n,x,y) + '<br>' + dotsHTML(n,x,true,'small');
        roundWon(1800);
      } else {
        st.firstTry=false; sBad(); st.busy=true;
        const s=x+y;
        $('#say').innerHTML = `${x} і ${y} — це ${s}. ${s>n?'Забагато! Візьми менше.':'Замало! Візьми більше.'}`;
        sel.forEach(k=>k.classList.add('shake'));
        setTimeout(()=>{ sel.forEach(k=>k.classList.remove('sel','shake')); sel=[]; paint(); st.busy=false; }, 900);
      }
    }
  });
}

  5:'На одній руці <b>5</b> пальчиків ✋. Загни кілька — і побачиш, з чого складається 5!',

  10:'<b>10</b> — це дві руки 🙌. Пари до 10 — «друзі десятки»: 1 і 9, 2 і 8, 3 і 7, 4 і 6, 5 і 5. Їх варто знати напам’ять!'
};
function renderLearn(){
  const n=st.learnN;
  let picker='<div class="learnnums">';
  for(let k=2;k<=10;k++) picker+=`<button data-n="${k}" class="${k===n?'sel':''}">${k}</button>`;
  picker+='</div>';
  let rows='';
  for(let a=1;a<n;a++) rows+=`<button class="lrow" data-a="${a}"><div class="win ca">${a}</div><div class="win cb">${n-a}</div></button>`;
  $('#stage').innerHTML = `
    ${picker}
    <p class="q">Будиночок числа ${n}</p>
    <div class="house">
      <div class="chimney"></div>
      <div class="roof"><span>${n}</span></div>
      <div class="walls">${rows}</div>
      <div class="grass"></div>
    </div>
    <div id="dots">${dotsHTML(n,1,true)}</div>
    <div class="say" id="say">Натискай на поверхи 👆</div>
    <div class="tip">💡 ${TIPS[n]}</div>
    <div style="text-align:center;margin-top:18px"><button class="cta" id="practice">Пограти з числом ${n}</button></div>`;
  $('#stage').querySelector('.learnnums').onclick = e=>{
    const b=e.target.closest('button'); if(!b) return; st.learnN=+b.dataset.n; sTap(st.learnN); renderLearn();
  };
  $('#stage').querySelectorAll('.lrow').forEach(r=> r.onclick = ()=>{
    const a=+r.dataset.a;
    $('#stage').querySelectorAll('.lrow').forEach(x=>x.classList.remove('lit')); r.classList.add('lit');
    $('#dots').innerHTML = dotsHTML(n,a,true);
    $('#say').innerHTML = sayHTML(n,a,n-a);
    tone(392,.12); tone(392+a*30,.18,'sine',.12);
  });
  $('#practice').onclick = ()=>{
    st.num=n;
    nums.querySelectorAll('.num').forEach(x=>x.classList.toggle('sel', x.dataset.n==String(n)));
    startMode('house');
  };
}
